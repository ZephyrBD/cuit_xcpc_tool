server {
    listen 80;
    server_name _;

    # 文件上传大小限制
    client_max_body_size 100M;

    # SSE 长连接配置
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding off;

    # 长连接超时配置
    proxy_connect_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;

    # 通用反向代理请求头
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;

    # ===================== CXTOOL 完整配置 =====================
    location /cxtool/admin/sse/connect {
        proxy_pass http://127.0.0.1:5883/cxtool/admin/sse/connect;
        proxy_redirect off;
    }

    location /cxtool {
        proxy_pass http://127.0.0.1:5883/cxtool;
        proxy_redirect off;
    }

    # ===================== Domjudge 全套鉴权配置 =====================
    location /dj/api {
        proxy_pass http://127.0.0.1:5881/dj/api;
        proxy_redirect off;
    }

    location /dj {
        if ($cookie_dj_auth != "ok") {
            return 403;
        }
        proxy_pass http://127.0.0.1:5881/dj;
        proxy_redirect off;
    }

    location /dj-verify {
        if ($arg_token = "") { return 403; }
        if ($arg_token = "null") { return 403; }
        auth_request /auth-check;
        try_files /__never_exists__ @dj_redirect;
    }
    
    location @dj_redirect {
        add_header Set-Cookie "dj_auth=ok; Path=/; HttpOnly; SameSite=Lax" always;
        return 302 /dj;
    }
    
    location = /auth-check {
        internal;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://127.0.0.1:5883/cxtool/public/auth/validate;
    }
}