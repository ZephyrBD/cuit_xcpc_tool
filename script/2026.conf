#CUITCPC 2026的nginx配置，要使用的话需要修改自己的域名，这个配置是给有域名的情况写的，如果没有域名，需要调整
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /path/to/certs/fullchain.pem;
    ssl_certificate_key /path/to/certs/privkey.pem;
    ssl_client_certificate /path/to/certs/cloudflare.crt;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding off;

    proxy_connect_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;

    location /cxtool/admin/sse/connect {
        proxy_pass http://localhost:5883/cxtool/admin/sse/connect;
    }

    location /r {
        alias /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /dp {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_pass http://127.0.0.1:5889/dp;
        proxy_redirect off;
    }

    location /grafana {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_pass http://127.0.0.1:5884/grafana;
        proxy_redirect off;
    }

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_pass https://127.0.0.1:8443;
        proxy_redirect off;
    }

    location /cxtool {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_pass http://127.0.0.1:5883/cxtool;
        proxy_redirect off;
    }

    # 放行domjudge的API接口
    location /dj/api {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_pass http://127.0.0.1:5881/dj/api;
        proxy_redirect off;
    }

    location /dj {
        if ($cookie_dj_auth != "ok") {
           return 403;
        }
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_pass http://127.0.0.1:5881/dj;
        proxy_redirect off;
    }

    location /dj-verify {
        if ($arg_token = "") { return 403; }
        if ($arg_token = "null") { return 403; }

        auth_request /auth-check;
        try_files /__never_exists__ @dj_redirect;
    }

    location @dj_redirect {
        add_header Set-Cookie "dj_auth=ok; Path=/; HttpOnly; SameSite=Lax" always;
        return 302 /dj;
    }

    location = /auth-check {
        internal;

        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_set_header X-Original-URI $request_uri;

        proxy_pass http://127.0.0.1:5883/cxtool/public/auth/validate;
    }
}