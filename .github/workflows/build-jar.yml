name: buildAll
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    steps:
      - name: pull project codes
        uses: actions/checkout@v4

      - name: set JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          cache: gradle

      - name: set Node.js 20 + 启用 pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      # 构建 Vue 前端
      - name: build Vue
        working-directory: ./vue
        run: |
          npm install
          npm run build

      # 构建 XCPCIO Board（现在 pnpm 可用）
      - name: build Board
        working-directory: ./xcpcio
        run: |
          pnpm install
          pnpm run build

      # 给Gradle执行权限
      - name: chmod Gradle
        run: chmod +x ./gradlew

      # 构建 SpringBoot Jar 包
      - name: build Jar
        run: ./gradlew clean build -x test

      # 上传Jar包
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuit_xcpc_tool
          path: build/libs/*.jar